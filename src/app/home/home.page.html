<ion-header [translucent]="true">
  <ion-toolbar color="light">
    <ion-title>
      Create Progress Report
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding page-bg">
  <div class="form-wrapper">
    <div class="report-card">
      <div class="card-header">
        <h1 class="card-title">Create Progress Report</h1>
        <p class="card-subtitle">Log learner progress and notify parents.</p>
      </div>

      <form (ngSubmit)="onSubmit()" #reportForm="ngForm" class="report-form">
        <!-- Select Learner Dropdown -->
        <div class="form-group">
          <label for="learner-select" class="form-label">Select Learner</label>
          <div class="select-wrapper">
            <select class="form-control select-control" id="learner-select" name="learner" [(ngModel)] ="selectedLearner" required>
              <option value="" disabled selected hidden>Select a learner...</option>
              <option *ngFor="let learner of learners" [value]="learner">
                {{ learner }}
              </option>
            </select>
          </div>
        </div>

        <!-- Report Type Dropdown -->
        <div class="form-group">
          <label for="report-type-select" class="form-label">Report Type</label>
          <div class="select-wrapper">
            <select class="form-control select-control" id="report-type-select" name="reportType" [(ngModel)]="selectedReportType" required>
              <option value="" disabled selected hidden>Select an option...</option>
              <option *ngFor="let type of reportTypes" [value]="type">
                {{ type }}
              </option>
            </select>
          </div>
        </div>

        <!-- Score Field (Optional) -->
        <div class="form-group">
          <label for="score-input" class="form-label">Score (Optional)</label>
          <input type="number" id="score-input" name="score" class="form-control" placeholder="0 - 100" min="0" max="100" [(ngModel)]="score"/>
        </div>

        <div class="form-actions">
          <button type="submit" class="submit-btn" [disabled]="!selectedLearner || !selectedReportType">
            Submit Report
          </button>
        </div>
      </form>
    </div>
  </div>
</ion-content>
